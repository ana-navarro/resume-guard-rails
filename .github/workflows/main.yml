name: resume-guard-rails CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make validate-pipeline

  # Only advances after validate-pipeline passes (unit tests + coverage >= 80%, see the Makefile),
  # and only on a real merge to main -- never on a PR. auto-update.sh in resume-server tracks this
  # branch (not main) for this repo, so the local dev environment only ever picks up commits that
  # have actually passed CI.
  promote:
    needs: validate-pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git push origin HEAD:refs/heads/deployed --force
